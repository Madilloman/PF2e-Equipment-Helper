name: Bug report
description: Something in the app is broken or behaves unexpectedly
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Which filters did you set and what did you click? If you can, use the app's share link and paste it here.
      placeholder: |
        1. Set class to Fighter, level 5
        2. Set budget to 160 gp
        3. ...
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome on Windows, Safari on iPhone
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: You can paste or drag images into this box.
