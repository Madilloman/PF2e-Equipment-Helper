name: Item data problem
description: An item has an incorrect description, traits or filter tags, or is missing
title: "[Data] "
labels: ["data"]
body:
  - type: input
    id: item
    attributes:
      label: Item name
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What's wrong?
      multiple: true
      options:
        - Incorrect item description/traits
        - Incorrect filter tags
        - Item Missing
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What does the app show, and what should it be?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: An Archives of Nethys link or book and page, if you have one.
