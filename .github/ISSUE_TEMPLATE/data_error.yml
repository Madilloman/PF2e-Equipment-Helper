name: Item data problem
description: An item has the wrong price, level, traits or effects, is missing, or is ranked oddly
title: "[Data] "
labels: ["data"]
body:
  - type: input
    id: item
    attributes:
      label: Item name
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What's wrong?
      multiple: true
      options:
        - Wrong price or level
        - Wrong traits or usage
        - Effect not detected or wrongly detected
        - Item missing
        - Ranked too high or too low
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What does the app show, and what should it be?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: An Archives of Nethys link or book and page, if you have one.
